<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Image Upload Preview</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, sans-serif; }
    body { padding: 2rem; background: #0f172a; color: #f8fafc; }
    
    .container { max-width: 600px; margin: 0 auto; background: #1e293b; padding: 1.5rem; border-radius: 12px; }
    
    .drop-zone {
      border: 2px dashed #3b82f6;
      border-radius: 8px;
      padding: 2rem;
      text-align: center;
      cursor: pointer;
      background: #0f172a;
      transition: background 0.2s ease;
    }
    .drop-zone:hover { background: #1e293b; }
    
    input[type="file"] { display: none; }
    
    .preview-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
      gap: 10px;
      margin-top: 1rem;
    }
    .preview-grid img {
      width: 100%;
      height: 100px;
      object-fit: cover;
      border-radius: 6px;
    }
    
    button {
      margin-top: 1rem;
      width: 100%;
      padding: 0.75rem;
      background: #2563eb;
      color: white;
      border: none;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
    }
    button:hover { background: #1d4ed8; }
  </style>
</head>
<body>

  <div class="container">
    <h2>Upload Images</h2>
    
    <label for="fileInput" class="drop-zone" id="dropZone">
      <p>Click or Drag & Drop images here</p>
      <input type="file" id="fileInput" accept="image/*" multiple />
    </label>

    <div class="preview-grid" id="previewGrid"></div>

    <button id="uploadBtn">Upload</button>
  </div>

  <script type="module">
    // Optional Stream.io import if using NPM modules/bundlers:
    // import { connect } from 'getstream';

    const fileInput = document.getElementById('fileInput');
    const previewGrid = document.getElementById('previewGrid');
    const uploadBtn = document.getElementById('uploadBtn');

    let selectedFiles = [];

    // Local Preview Functionality
    fileInput.addEventListener('change', (e) => {
      const files = Array.from(e.target.files);
      selectedFiles.push(...files);
      renderPreviews();
    });

    function renderPreviews() {
      previewGrid.innerHTML = '';
      selectedFiles.forEach((file) => {
        const img = document.createElement('img');
        img.src = URL.createObjectURL(file);
        previewGrid.appendChild(img);
      });
    }

    // Handlers for Stream.io Upload logic
    uploadBtn.addEventListener('click', async () => {
      if (selectedFiles.length === 0) {
        alert("Please select an image first!");
        return;
      }

      console.log("Selected files ready to upload:", selectedFiles);

      /* 
         Stream.io API Integration Pattern:
         ----------------------------------
         // 1. Initialize Stream Client (requires user token from your backend)
         // const client = connect('YOUR_API_KEY', userToken, 'YOUR_APP_ID');

         // 2. Upload file to Stream CDN
         // for (let file of selectedFiles) {
         //   const response = await client.uploadImage({ file });
         //   console.log('Uploaded image URL:', response.file);
         // }
      */

      alert(`Ready to upload ${selectedFiles.length} file(s)!`);
    });
  </script>
</body>
</html>
